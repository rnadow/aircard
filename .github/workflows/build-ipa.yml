name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-ios26.4"

permissions:
  contents: read

jobs:
  build:
    name: Build AirCard-iOS 26.4 experimental
    runs-on: macos-15
    timeout-minutes: 30

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Show Apple toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build unsigned IPA
        run: |
          chmod +x build-ipa.sh
          ./build-ipa.sh Release

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"([^"]+)"/\1/p' project.yml | head -n 1)"
          test -n "$VERSION"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            EXPECTED_TAG="v${VERSION}-ios26.4"
            test "$GITHUB_REF_NAME" = "$EXPECTED_TAG" || {
              echo "Tag $GITHUB_REF_NAME does not match project version $EXPECTED_TAG" >&2
              exit 1
            }
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify package
        run: |
          test -s build/AirCard-iOS.ipa
          unzip -t build/AirCard-iOS.ipa
          cd build
          shasum -a 256 AirCard-iOS.ipa | tee AirCard-iOS.ipa.sha256

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: AirCard-iOS-26.4-unsigned
          path: |
            build/AirCard-iOS.ipa
            build/AirCard-iOS.ipa.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish versioned pre-release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the exact build artifact
        uses: actions/download-artifact@v8
        with:
          name: AirCard-iOS-26.4-unsigned
          path: build

      - name: Prepare versioned release assets
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          mv build/AirCard-iOS.ipa "build/AirCard-iOS-v${VERSION}.ipa"
          cd build
          sha256sum "AirCard-iOS-v${VERSION}.ipa" > "AirCard-iOS-v${VERSION}.ipa.sha256"

      - name: Write release notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cat > release-notes.md <<EOF
          ## AirCard-iOS 26.4 Experimental — v${VERSION}

          > **Pre-release / 实验性预发布版本**

          This unsigned IPA was built and published automatically by GitHub Actions from commit \`${GITHUB_SHA}\`.

          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Versioned IPA and SHA-256 checksum are attached below.
          - Sign the IPA with a method you control before installation.
          - Run the iOS 26.4 compatibility probe before modifying Wallet.
          - Never publish pairing records, certificates, UDIDs, card hashes, or complete device logs.

          Documentation: [English README](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}#readme) · [中文 README](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/README.zh-CN.md) · [Project site](https://rnadow.github.io/aircard/)
          EOF

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/AirCard-iOS-v${VERSION}.ipa" \
            "build/AirCard-iOS-v${VERSION}.ipa.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "AirCard-iOS 26.4 Experimental v${VERSION}" \
            --notes-file release-notes.md
